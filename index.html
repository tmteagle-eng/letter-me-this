<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FBFAF5">
  <title>Letter Me This! | Nicholas Street Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #FBFAF5;
      --card: #FFFFFF;
      --ink: #1D2624;
      --ink-soft: #52605C;
      --ink-faint: #8A968F;
      --hair: #E7E4DA;
      --teal: #20B2AA;
      --teal-ink: #0E6A64;
      --mint: #E7F4EC;
      --yellow: #F5C518;
      --amber-ink: #B8720A;
      --coral: #E85D3D;
      --coral-ink: #B8402A;
      --green: #3A7D44;
      --display: 'Baloo 2', ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
      --body: 'Nunito', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--body);
      background:
        radial-gradient(60% 55% at 14% 6%, rgba(32,178,170,0.14) 0%, transparent 60%),
        radial-gradient(55% 50% at 90% 96%, rgba(245,197,24,0.18) 0%, transparent 60%),
        var(--ground);
      color: var(--ink);
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      text-align: center;
      padding: 1.25rem 1rem 0.25rem;
      width: 100%;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 2.1rem;
      color: var(--ink);
      letter-spacing: 0;
    }

    h1 span { color: var(--coral); }

    .subtitle {
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--ink-faint);
      margin-top: 0.15rem;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 0.75rem 1rem;
      gap: 1.25rem;
    }

    /* --- Dice Area --- */
    .dice-area {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .die-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .die-label {
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ink-faint);
    }

    .die {
      width: 32vw;
      height: 32vw;
      max-width: 140px;
      max-height: 140px;
      min-width: 100px;
      min-height: 100px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      position: relative;
      -webkit-touch-callout: none;
    }

    .die:active { transform: scale(0.95); }

    .die-letter {
      background: var(--card);
      border: 3px solid var(--teal);
      color: var(--teal-ink);
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      box-shadow: 0 10px 26px rgba(20,40,35,0.10);
    }

    .die-number {
      background: var(--card);
      border: 3px solid var(--coral);
      color: var(--coral-ink);
      font-family: var(--display);
      font-weight: 800;
      box-shadow: 0 10px 26px rgba(20,40,35,0.10);
    }

    .die.rolling {
      animation: roll 0.1s ease-in-out infinite;
    }

    @keyframes roll {
      0% { transform: rotate(0deg) scale(1.05); }
      25% { transform: rotate(5deg) scale(1.08); }
      50% { transform: rotate(0deg) scale(1.05); }
      75% { transform: rotate(-5deg) scale(1.08); }
      100% { transform: rotate(0deg) scale(1.05); }
    }

    .die.landed {
      animation: land 0.3s ease-out;
    }

    @keyframes land {
      0% { transform: scale(1.1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }


    /* --- Roll Button --- */
    .roll-btn {
      background: var(--coral);
      color: #fff;
      border: none;
      padding: 0.9rem 3rem;
      border-radius: 50px;
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 18px rgba(232, 93, 61, 0.32);
      min-height: 50px;
      touch-action: manipulation;
    }

    .roll-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(232, 93, 61, 0.42);
    }

    .roll-btn:active { transform: translateY(0); }
    .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* --- Result Text --- */
    .result-text {
      text-align: center;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.5rem;
    }

    .result-text p {
      font-family: var(--body);
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .result-text .letter-highlight { color: var(--teal-ink); font-weight: 800; }
    .result-text .number-highlight { color: var(--coral-ink); font-weight: 800; }

    /* --- Timer Section --- */
    .timer-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--hair);
    }

    .timer-presets {
      display: flex;
      gap: 0.5rem;
    }

    .preset-btn {
      background: var(--card);
      color: var(--ink-soft);
      border: 2px solid var(--hair);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      min-height: 44px;
      touch-action: manipulation;
    }

    .preset-btn:hover { border-color: var(--teal); }

    .preset-btn.active {
      border-color: var(--teal);
      color: var(--teal-ink);
      background: var(--mint);
    }

    .timer-display {
      font-family: var(--display);
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 2px;
      min-width: 200px;
      text-align: center;
      line-height: 1;
      padding: 0.25rem 0;
    }

    .timer-display.warning { color: var(--amber-ink); }
    .timer-display.danger { color: var(--coral); }

    .timer-display.flashing {
      animation: flash 0.5s ease-in-out infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; color: var(--coral); }
      50% { opacity: 0.2; color: var(--coral); }
    }

    .timer-controls {
      display: flex;
      gap: 0.75rem;
    }

    .timer-btn {
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 50px;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      min-height: 48px;
      touch-action: manipulation;
    }

    .timer-btn:active { transform: scale(0.95); }

    .timer-btn.start {
      background: var(--green);
      color: #fff;
    }

    .timer-btn.stop {
      background: var(--coral);
      color: #fff;
    }

    .timer-btn.reset {
      background: var(--hair);
      color: var(--ink-soft);
    }

    footer {
      padding: 1rem;
      text-align: center;
      font-family: var(--body);
      font-size: 0.7rem;
      color: var(--ink-faint);
    }

    footer a { color: var(--teal-ink); text-decoration: none; font-weight: 700; }
    footer a:hover { color: var(--coral); }

    /* --- Small phones (under 380px wide) --- */
    @media (max-width: 380px) {
      h1 { font-size: 1.85rem; }
      .die { min-width: 85px; min-height: 85px; border-radius: 16px; }
      .die-letter { font-size: 2.75rem; }
      .die-number { font-size: 2.25rem; }
      .timer-display { font-size: 3.5rem; min-width: 160px; }
      .dice-area { gap: 1rem; }
      .roll-btn { padding: 0.8rem 2rem; font-size: 1rem; }
    }

    /* --- Tablets and larger phones in landscape --- */
    @media (min-width: 600px) {
      header { padding: 2rem 1rem 0.5rem; }
      h1 { font-size: 3rem; }
      .subtitle { font-size: 0.9rem; }
      main { gap: 1.75rem; padding: 1.5rem; }
      .die { max-width: 160px; max-height: 160px; border-radius: 24px; }
      .die-letter { font-size: 4rem; }
      .die-number { font-size: 3.5rem; }
      .dice-area { gap: 2.5rem; }
      .roll-btn { padding: 1rem 3.5rem; font-size: 1.2rem; }
      .result-text p { font-size: 1.15rem; }
      .timer-display { font-size: 5.5rem; min-width: 240px; }
      .preset-btn { padding: 0.7rem 1.5rem; font-size: 1rem; }
      .timer-btn { padding: 0.8rem 2.5rem; font-size: 1.05rem; }
    }

    /* --- Landscape on phones: tighten vertical spacing --- */
    @media (max-height: 500px) and (orientation: landscape) {
      header { padding: 0.5rem 1rem 0.15rem; }
      h1 { font-size: 1.5rem; }
      .subtitle { display: none; }
      main { gap: 0.5rem; padding: 0.5rem 1rem; }
      .die-label { display: none; }
      .die { min-width: 70px; min-height: 70px; max-width: 80px; max-height: 80px; border-radius: 14px; }
      .die-letter { font-size: 2.25rem; }
      .die-number { font-size: 2rem; }
      .roll-btn { padding: 0.5rem 2rem; font-size: 0.9rem; min-height: 40px; }
      .result-text { min-height: 1.5rem; }
      .result-text p { font-size: 0.9rem; }
      .timer-section { gap: 0.35rem; padding-top: 0.35rem; }
      .timer-display { font-size: 2.75rem; padding: 0; }
      .timer-btn { padding: 0.4rem 1.5rem; min-height: 38px; font-size: 0.85rem; }
      .preset-btn { padding: 0.35rem 0.85rem; min-height: 36px; font-size: 0.8rem; }
      footer { padding: 0.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Letter Me <span>This!</span></h1>
    <p class="subtitle">Nicholas Street Games</p>
  </header>

  <main>
    <div class="dice-area">
      <div class="die-container">
        <span class="die-label">Letter</span>
        <div class="die die-letter" id="letterDie">?</div>
      </div>
      <div class="die-container">
        <span class="die-label">Count</span>
        <div class="die die-number" id="numberDie">?</div>
      </div>
    </div>

    <button class="roll-btn" id="rollBtn">Roll Dice</button>

    <div class="result-text" id="resultText"></div>

    <div class="timer-section">
      <div class="timer-presets">
        <button class="preset-btn" data-seconds="90">1:30</button>
        <button class="preset-btn active" data-seconds="120">2:00</button>
        <button class="preset-btn" data-seconds="180">3:00</button>
      </div>

      <div class="timer-display" id="timerDisplay">2:00</div>

      <div class="timer-controls">
        <button class="timer-btn start" id="startBtn">Start</button>
        <button class="timer-btn reset" id="resetBtn">Reset</button>
      </div>
    </div>
  </main>

  <footer>
    <a href="https://nicholasstreetgames.com">nicholasstreetgames.com</a>
  </footer>

  <script>
    // --- 20-sided letter die: all letters except Q, U, V, X, Y, Z ---
    const LETTER_FACES = [
      'A','B','C','D','E','F','G','H','I','J',
      'K','L','M','N','O','P','R','S','T','W'
    ];

    // --- Standard 6-sided number die: 1 through 6 ---
    const NUMBER_FACES = [1, 2, 3, 4, 5, 6];

    const letterDie = document.getElementById('letterDie');
    const numberDie = document.getElementById('numberDie');
    const rollBtn = document.getElementById('rollBtn');
    const resultText = document.getElementById('resultText');
    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetBtns = document.querySelectorAll('.preset-btn');

    let isRolling = false;
    let timerInterval = null;
    let timerSeconds = 120;
    let timerRunning = false;
    let selectedPreset = 120;

    // --- Dice Rolling ---
    function rollDice() {
      if (isRolling) return;
      isRolling = true;
      rollBtn.disabled = true;

      // Stop any running timer and reset
      stopTimer();
      resetTimer();

      letterDie.classList.remove('landed');
      numberDie.classList.remove('landed');
      letterDie.classList.add('rolling');
      numberDie.classList.add('rolling');
      resultText.innerHTML = '';

      // Rapidly cycle through faces during animation
      const rollDuration = 1200;
      const cycleSpeed = 60;
      let elapsed = 0;

      const cycleInterval = setInterval(() => {
        elapsed += cycleSpeed;
        letterDie.textContent = LETTER_FACES[Math.floor(Math.random() * LETTER_FACES.length)];
        numberDie.textContent = NUMBER_FACES[Math.floor(Math.random() * NUMBER_FACES.length)];

        if (elapsed >= rollDuration) {
          clearInterval(cycleInterval);

          // Pick final results
          const letter = LETTER_FACES[Math.floor(Math.random() * LETTER_FACES.length)];
          const number = NUMBER_FACES[Math.floor(Math.random() * NUMBER_FACES.length)];

          letterDie.classList.remove('rolling');
          numberDie.classList.remove('rolling');
          letterDie.classList.add('landed');
          numberDie.classList.add('landed');

          letterDie.textContent = letter;
          numberDie.textContent = number;

          // Show result message
          resultText.innerHTML = `<p>Play <span class="number-highlight">${number}</span> words starting with <span class="letter-highlight">${letter}</span></p>`;

          isRolling = false;
          rollBtn.disabled = false;
        }
      }, cycleSpeed);
    }

    rollBtn.addEventListener('click', rollDice);

    // Also allow tapping either die to roll
    letterDie.addEventListener('click', rollDice);
    numberDie.addEventListener('click', rollDice);

    // --- Timer ---
    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = formatTime(timerSeconds);

      timerDisplay.classList.remove('warning', 'danger', 'flashing');
      if (timerSeconds <= 0) {
        timerDisplay.classList.add('flashing');
      } else if (timerSeconds <= 10) {
        timerDisplay.classList.add('danger');
      } else if (timerSeconds <= 30) {
        timerDisplay.classList.add('warning');
      }
    }

    function startTimer() {
      if (timerRunning) {
        // Pause
        stopTimer();
        return;
      }

      if (timerSeconds <= 0) {
        resetTimer();
      }

      timerRunning = true;
      startBtn.textContent = 'Pause';
      startBtn.classList.remove('start');
      startBtn.classList.add('stop');

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds <= 0) {
          stopTimer();
          timerDisplay.classList.add('flashing');
          startBtn.textContent = 'Start';
          startBtn.classList.remove('stop');
          startBtn.classList.add('start');
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      startBtn.textContent = 'Start';
      startBtn.classList.remove('stop');
      startBtn.classList.add('start');
    }

    function resetTimer() {
      stopTimer();
      timerSeconds = selectedPreset;
      timerDisplay.classList.remove('flashing', 'warning', 'danger');
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Preset buttons
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPreset = parseInt(btn.dataset.seconds, 10);
        resetTimer();
      });
    });

    // Initialize display
    updateTimerDisplay();
  </script>

</body>
</html>
